<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar conta - Cloud Security Monitor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7fb;
            font-family: Arial, Helvetica, sans-serif;
            color: #172033;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #687386;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dbe5;
            border-radius: 9px;
            font-size: 15px;
            margin-bottom: 18px;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 9px;
            padding: 14px;
            background: #172033;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            opacity: .92;
        }

        .success {
            padding: 13px;
            margin-bottom: 20px;
            border-radius: 9px;
            background: #e9f8ef;
            color: #16733a;
        }

        .error {
            padding: 13px;
            margin-bottom: 20px;
            border-radius: 9px;
            background: #fff0f0;
            color: #b42318;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #475467;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Recuperar conta</h1>

    <p class="subtitle">
        Redefinição de senha da conta administrativa.
    </p>

    {% if sucesso %}
        <div class="success">
            Senha redefinida com sucesso.
        </div>
    {% endif %}

    {% if erro %}
        <div class="error">
            {{ erro }}
        </div>
    {% endif %}

    <form method="POST" action="/admin/recuperar-victor" id="recoveryForm">

        <input type="hidden" name="csrf_token" id="csrf_token">

        <label for="senha">
            Nova senha
        </label>

        <input
            type="password"
            id="senha"
            name="senha"
            minlength="6"
            required
            placeholder="Digite a nova senha"
        >

        <button type="submit" id="submitButton">
            Redefinir senha
        </button>

    </form>

    <a class="back" href="/admin">
        ← Voltar para administração
    </a>

</div>

<script>
(async function () {

    const form = document.getElementById("recoveryForm");
    const csrfInput = document.getElementById("csrf_token");
    const button = document.getElementById("submitButton");

    try {

        const response = await fetch("/api/csrf-token", {
            method: "GET",
            credentials: "same-origin"
        });

        if (!response.ok) {
            throw new Error("Não foi possível obter o token CSRF.");
        }

        const data = await response.json();

        if (!data.csrf_token) {
            throw new Error("Token CSRF não recebido.");
        }

        csrfInput.value = data.csrf_token;

    } catch (error) {

        button.disabled = true;
        button.textContent = "Erro ao carregar segurança";

        console.error(error);
    }

    form.addEventListener("submit", function (event) {

        if (!csrfInput.value) {
            event.preventDefault();
            alert("O sistema de segurança ainda não carregou. Atualize a página e tente novamente.");
            return;
        }

        button.disabled = true;
        button.textContent = "Redefinindo...";
    });

})();
</script>

</body>
</html>
